name: Pebble
options:
  bundleIdPrefix: com.mdxos.pebble
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
# The name, the version and the build number come from Config/, so every
# target and platform shares them. Bump them in Config/Version.xcconfig.
configFiles:
  Debug: Config/Project.xcconfig
  Release: Config/Project.xcconfig
packages:
  PebbleKit:
    path: Packages/PebbleKit
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  Pebble:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - App/Sources
      # The app icon, the launch color and the privacy manifest.
      - App/Resources
    dependencies:
      - package: PebbleKit
        products: [PebbleCore, PebbleModel, PebbleUI]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(BRAND_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PebbleBrandName: $(BRAND_NAME)
        LSApplicationCategoryType: public.app-category.productivity
        # The app does no networking and no encryption of its own. The only
        # encryption is the system's file protection, which is exempt.
        # Look again when a model adapter talks to a server.
        ITSAppUsesNonExemptEncryption: false
        # The launch screen is the backdrop's color, light or dark, so the
        # first screen comes in without a flash.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Every orientation on iPad, which Split View, Slide Over and Stage Manager need.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
    scheme:
      testTargets: [PebbleAppUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdxos.pebble
        PRODUCT_NAME: $(BRAND_NAME)
        PRODUCT_MODULE_NAME: Pebble
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Theme draws the accent, so there is no accent color asset and the
        # system tint stays as it was.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
      configs:
        # The Mac App Store and TestFlight for Mac need the sandbox. Debug
        # stays outside it so `make screenshots` can write its PNG anywhere.
        # The app asks for nothing beyond the sandbox itself.
        Release:
          "ENABLE_APP_SANDBOX[sdk=macosx*]": YES
  # Drives the iOS app in the Simulator: the iPad sidebar, keyboard
  # shortcuts, and screenshots in each orientation. `make ui-test`.
  PebbleAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AppUITests
    dependencies:
      - target: Pebble
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdxos.pebble.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Pebble
        TARGETED_DEVICE_FAMILY: "1,2"
