name: Pebble
options:
  bundleIdPrefix: com.mdxos.pebble
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
configFiles:
  Debug: Config/Brand.xcconfig
  Release: Config/Brand.xcconfig
packages:
  PebbleKit:
    path: Packages/PebbleKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  Pebble:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - App/Sources
      # The app icon, the system accent and the launch background, in the
      # colors Theme.swift defines (PebbleUI).
      - App/Assets.xcassets
    dependencies:
      - package: PebbleKit
        products: [PebbleCore, PebbleModel, PebbleUI, PebbleBackground, PebbleVoice]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(BRAND_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PebbleBrandName: $(BRAND_NAME)
        # Empty unless set in Config/Cloud.xcconfig. Empty means no cloud model.
        PebbleCloudEndpoint: $(PEBBLE_CLOUD_ENDPOINT)
        LSApplicationCategoryType: public.app-category.productivity
        # The backdrop's warm top, so launch fades straight into the first screen.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Every orientation on iPad, which Split View, Slide Over and Stage Manager need.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # Background work on iPhone and iPad, off until the person turns it
        # on. Must match BackgroundIdentifiers in PebbleCore; BackgroundTests checks.
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).background.refresh
        UIBackgroundModes:
          - fetch
        # Hold to talk. Asked the first time the person holds the microphone,
        # never at launch. Speech is heard on the device only (DeviceSpeech).
        NSMicrophoneUsageDescription: So you can talk instead of typing. I listen only while you're talking to me, and I keep no recording.
        NSSpeechRecognitionUsageDescription: So I can turn what you say into words. That happens on this device, and what you say is never sent anywhere to be understood.
    scheme:
      testTargets: [PebbleAppUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdxos.pebble
        PRODUCT_NAME: $(BRAND_NAME)
        PRODUCT_MODULE_NAME: Pebble
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        ENABLE_HARDENED_RUNTIME: YES
  # Drives the iOS app in the Simulator: the iPad sidebar, keyboard
  # shortcuts, and screenshots in each orientation. `make ui-test`.
  PebbleAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AppUITests
    dependencies:
      - target: Pebble
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdxos.pebble.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Pebble
        TARGETED_DEVICE_FAMILY: "1,2"
