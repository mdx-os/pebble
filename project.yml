name: Pebble
options:
  bundleIdPrefix: com.mdxos.pebble
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
configFiles:
  Debug: Config/Brand.xcconfig
  Release: Config/Brand.xcconfig
packages:
  PebbleKit:
    path: Packages/PebbleKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  Pebble:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - App/Sources
    dependencies:
      - package: PebbleKit
        products: [PebbleCore, PebbleModel, PebbleUI]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(BRAND_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PebbleBrandName: $(BRAND_NAME)
        # Empty unless set in Config/Cloud.local.xcconfig, which git ignores.
        # Empty means no cloud model. A build that could ship may have one
        # only with PEBBLE_CLOUD_POLICY equal to CloudPolicy.currentVersion.
        PebbleCloudEndpoint: $(PEBBLE_CLOUD_ENDPOINT)
        # The policy the build was checked against, from Config/Cloud.xcconfig.
        PebbleCloudPolicy: $(PEBBLE_CLOUD_POLICY)
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        # Every orientation on iPad, which Split View, Slide Over and Stage Manager need.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
    # Every build checks first, so any build with a cloud address fails
    # unless it is Debug and not an archive, or names the current cloud
    # policy with a plain https address, wherever the address came from.
    preBuildScripts:
      - name: Cloud address only with the cloud policy
        script: sh "$SRCROOT/scripts/release-endpoint-check.sh"
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/scripts/release-endpoint-check.sh
    scheme:
      testTargets: [PebbleAppUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdxos.pebble
        PRODUCT_NAME: $(BRAND_NAME)
        PRODUCT_MODULE_NAME: Pebble
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        ENABLE_HARDENED_RUNTIME: YES
  # Drives the iOS app in the Simulator: the iPad sidebar, keyboard
  # shortcuts, and screenshots in each orientation. `make ui-test`.
  PebbleAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AppUITests
    dependencies:
      - target: Pebble
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdxos.pebble.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Pebble
        TARGETED_DEVICE_FAMILY: "1,2"
