name: Pulse

# Manual only. Leave the schedule commented out until a daily X search budget is set.
# Proposed morning run, 13:15 UTC:
# on:
#   schedule:
#     - cron: "15 13 * * *"
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pulse:
    name: Fetch sources and write a digest
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Run pulse
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: swift run --package-path Packages/PebbleKit pebble-pulse --sources pulse/sources.json --snapshots pulse/snapshots --digest build/pulse/digest.md

      - name: Upload digest and snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-digest
          path: |
            build/pulse/digest.md
            pulse/snapshots
          if-no-files-found: warn
