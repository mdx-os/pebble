name: Pulse

on:
  workflow_dispatch:
  # Morning runs stay commented out until a later change commits snapshots.
  # schedule:
  #   - cron: "15 13 * * *"

permissions:
  contents: read

jobs:
  pulse:
    name: Competitor watch
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Fetch sources and write a digest
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: make pulse

      - name: Upload digest and snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-digest
          path: |
            pulse/digest.json
            pulse/snapshots
          if-no-files-found: warn

      # Present only when this run found a real change. A quiet run leaves no notice.
      - name: Upload the notification
        if: hashFiles('build/pulse/notify.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pulse-notify
          path: |
            build/pulse/notify.md
            build/pulse/summary.json
          if-no-files-found: ignore
