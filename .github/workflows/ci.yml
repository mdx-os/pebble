name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on Mac, iPhone and iPad
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install tools
        run: brew install xcodegen gitleaks

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Secrets check
        run: make secrets-check

      # The comment lint's list of names comes from a secret, so no name is
      # ever in the repository. A pull request from a fork gets no secrets:
      # the lint then warns on the pull request that names weren't checked,
      # rather than failing or passing quietly.
      - name: Names for the comment lint
        env:
          NAMES: ${{ secrets.COMMENT_LINT_NAMES }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ -n "$NAMES" ]; then
            printf '%s\n' "$NAMES" > "$RUNNER_TEMP/comment-lint-names.txt"
            echo "COMMENT_LINT_NAMES=$RUNNER_TEMP/comment-lint-names.txt" >> "$GITHUB_ENV"
          elif [ "$FORK" = "true" ]; then
            echo "COMMENT_LINT_NO_NAMES_REASON=a pull request from a fork gets no secrets" >> "$GITHUB_ENV"
          fi

      - name: Verify
        run: make verify

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots
          if-no-files-found: warn
